# Conda/Miniforge alternative (Windows, macOS, Linux). The recorded results
# were produced with requirements-lock-linux.txt on Linux.
name: excavator_pinocchio_validation
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pinocchio=3.8.0
  - numpy=2.3.5
  - scipy=1.17.0
  - matplotlib=3.10.8
  - pillow=12.3.0
  - jsonschema=4.25.1
  - pip
  - pip:
      - vtk==9.4.2
      - imageio==2.37.0
      - imageio-ffmpeg==0.6.0
